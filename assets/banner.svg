  <!-- Bottom accent -->
  <rect x="0" y="496" width="1500" height="4" fill="#00D4FF" opacity="0.4"/>

  <!-- Corner marks -->
  <g stroke="#1E293B" stroke-width="2" fill="none">
    <path d="M 30 30 L 30 60 M 30 30 L 60 30"/>
    <path d="M 1470 30 L 1440 30 M 1470 30 L 1470 60"/>
    <path d="M 30 470 L 30 440 M 30 470 L 60 470"/>
    <path d="M 1470 470 L 1440 470 M 1470 470 L 1470 440"/>
  </g>

</svg>
