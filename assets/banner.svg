        <g><rect x="68"  y="28" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="99.5" y="42.5" text-anchor="middle">SEO</text></g>
        <g><rect x="136" y="28" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="167.5" y="42.5" text-anchor="middle">Analytics</text></g>
        <g><rect x="204" y="28" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="235.5" y="42.5" text-anchor="middle">Onboard</text></g>
      </g>
