    <g transform="translate(0, 30)">
      <text x="0" y="14" fill="#00D4FF" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11" letter-spacing="3">CORE · 7</text>
      <g transform="translate(0, 28)" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">
        <g><rect x="0"   y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="31.5" y="14.5" text-anchor="middle">Interview</text></g>
        <g><rect x="68"  y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="99.5" y="14.5" text-anchor="middle">Architect</text></g>
        <g><rect x="136" y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="167.5" y="14.5" text-anchor="middle">Frontend</text></g>
        <g><rect x="204" y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="235.5" y="14.5" text-anchor="middle">Backend</text></g>
        <g><rect x="272" y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="303.5" y="14.5" text-anchor="middle">Data</text></g>
        <g><rect x="340" y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="371.5" y="14.5" text-anchor="middle">Integrate</text></g>
        <g><rect x="408" y="0" width="63" height="22" rx="11" fill="rgba(0,212,255,0.15)" stroke="#00D4FF" stroke-width="0.8"/><text x="439.5" y="14.5" text-anchor="middle">Translate</text></g>
