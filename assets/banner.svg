        <g><rect x="136" y="0" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="167.5" y="14.5" text-anchor="middle">Forms</text></g>
        <g><rect x="204" y="0" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="235.5" y="14.5" text-anchor="middle">Search</text></g>
        <g><rect x="272" y="0" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="303.5" y="14.5" text-anchor="middle">Email</text></g>
        <g><rect x="340" y="0" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="371.5" y="14.5" text-anchor="middle">Files</text></g>
        <g><rect x="408" y="0" width="63" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6" stroke-width="0.8"/><text x="439.5" y="14.5" text-anchor="middle">Admin</text></g>
