    <!-- Stats block -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" fill="#64748B" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11" letter-spacing="3">// STATS</text>
      <text x="0" y="32" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="22">24<tspan fill="#64748B" font-weight="500" font-size="14"> AGENTS</tspan></text>
      <text x="105" y="32" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="22">60+<tspan fill="#64748B" font-weight="500" font-size="14"> CHECKS</tspan></text>
      <text x="225" y="32" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="22">∞<tspan fill="#64748B" font-weight="500" font-size="14"> EXTENDABLE</tspan></text>
    </g>

