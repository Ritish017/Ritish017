      <g transform="translate(0, 28)" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">
        <g><rect x="0"   y="0" width="74" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8"/><text x="37" y="14.5" text-anchor="middle">Build</text></g>
        <g><rect x="79"  y="0" width="74" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8"/><text x="116" y="14.5" text-anchor="middle">Spec</text></g>
        <g><rect x="158" y="0" width="74" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8"/><text x="195" y="14.5" text-anchor="middle">Consistency</text></g>
        <g><rect x="237" y="0" width="74" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8"/><text x="274" y="14.5" text-anchor="middle">A11y</text></g>
        <g><rect x="316" y="0" width="74" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8"/><text x="353" y="14.5" text-anchor="middle">Security</text></g>
        <g><rect x="395" y="0" width="74" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="0.8"/><text x="432" y="14.5" text-anchor="middle">UX</text></g>
      </g>
