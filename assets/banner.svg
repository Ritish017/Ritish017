<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="taglineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="#0D1117"/>

  <!-- Atmospheric blobs -->
  <circle cx="1280" cy="120" r="260" fill="url(#b1)"/>
  <circle cx="180"  cy="420" r="220" fill="url(#b2)"/>
  <circle cx="1100" cy="430" r="160" fill="url(#b3)"/>
  <circle cx="700"  cy="250" r="120" fill="url(#b1)" opacity="0.5"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1500" height="4" fill="#00D4FF"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#00D4FF" stroke-width="1">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="200"  y1="0" x2="200"  y2="500"/>
    <line x1="500"  y1="0" x2="500"  y2="500"/>
    <line x1="800"  y1="0" x2="800"  y2="500"/>
    <line x1="1100" y1="0" x2="1100" y2="500"/>
  </g>

  <!-- ─── LEFT: IDENTITY ─── -->

  <g transform="translate(80, 90)">
    <circle cx="10" cy="10" r="10" fill="#00D4FF" opacity="0.18"/>
    <circle cx="10" cy="10" r="5"  fill="#00D4FF"/>
    <text x="40" y="16" fill="#00D4FF" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" font-size="18" letter-spacing="5">AI ENGINEER  ·  MULTI-AGENT SYSTEMS</text>
  </g>

  <text x="80" y="220" fill="url(#textGrad)" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="-1">Ritish Kurma</text>

  <text x="80" y="288" fill="url(#taglineGrad)" font-family="Arial, sans-serif" font-weight="800" font-size="34">Building AI that thinks &amp; ships.</text>

  <text x="80" y="338" fill="#94A3B8" font-family="Arial, sans-serif" font-weight="500" font-size="22">LangGraph · MCP · RAG · Production AI · Multi-agent orchestration</text>

  <!-- Status pills -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="170" height="40" rx="6" fill="rgba(0,212,255,0.10)" stroke="#00D4FF" stroke-width="1.5"/>
    <text x="85" y="26" fill="#00D4FF" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">@ COGNIZANT</text>

    <rect x="190" y="0" width="200" height="40" rx="6" fill="rgba(139,92,246,0.10)" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="290" y="26" fill="#A78BFA" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">HYDERABAD · INDIA</text>

    <circle cx="395" cy="20" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="410" y="0" width="290" height="40" rx="6" fill="rgba(16,185,129,0.10)" stroke="#10B981" stroke-width="1.5"/>
    <text x="555" y="26" fill="#34D399" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">OPEN TO SENIOR AI ENGINEER ROLES</text>
  </g>

