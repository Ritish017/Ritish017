name: Generate Snake Animation

on:
  # Run every 12 hours so the snake stays current
  schedule:
    - cron: "0 */12 * * *"

  # Run on pushes to main so it updates immediately if you tweak things
  push:
    branches:
      - main

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs (light + dark themes)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Ritish017
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push the generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
